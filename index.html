<!-- Base style adapted from: https://github.com/Sujar-Henry/Code_Examples/tree/main/html_vs_css/html_and_css -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernando Mejia's Website</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><!-- For logos -->
</head>
<body>
  <div id="particles-js"></div>

  <div class="container">
    <div class="form-box">
      <h2>Fernando Mejia</h2>
      <p class="tagline">Aspiring Software Engineer | Web Developer</p>

      <div class="about-section">
        <p>
          Welcome to my personal website! I'm passionate about building projects
          that blend creativity and logic. This space is currently under construction,
          but feel free to connect with me below.
        </p>
      </div>

        <div class="social-links">
        <a href="https://github.com/feesmeji" target="_blank" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/fernandoemejia/" target="_blank" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="resume.pdf" target="_blank" aria-label="Resume">
            <i class="fa-solid fa-file"></i>
        </a>
        </div>
      <p class="construction-note">🚧 Website Under Construction 🚧</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      particlesJS('particles-js', {
        "particles": {
          "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
          "color": { "value": "#ffd700" },
          "shape": { "type": "circle" },
          "opacity": {
            "value": 0.8, "random": true,
            "anim": { "enable": true, "speed": 1, "opacity_min": 0.4 }
          },
          "size": {
            "value": 5, "random": true,
            "anim": { "enable": true, "speed": 2, "size_min": 1 }
          },
          "line_linked": {
            "enable": true, "distance": 150,
            "color": "#ffd700", "opacity": 0.6, "width": 1.5
          },
          "move": {
            "enable": true, "speed": 2, "direction": "none",
            "random": true, "straight": false, "out_mode": "out"
          }
        },
        "interactivity": {
          "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } },
          "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
        },
        "retina_detect": true
      });
    });
  </script>
</body>
</html>
